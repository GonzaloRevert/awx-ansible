---
- name: Validar despliegue web
  hosts: Origenes
  become: true
  gather_facts: true

  tasks:
    - name: Comprobar estado de Nginx
      ansible.builtin.command:
        cmd: service nginx status
      register: nginx_status
      changed_when: false
      failed_when: false

    - name: Validar que Nginx está activo
      ansible.builtin.assert:
        that:
          - nginx_status.rc == 0
        fail_msg: "Nginx no está activo en {{ inventory_hostname }}"
        success_msg: "Nginx está activo en {{ inventory_hostname }}"

    - name: Comprobar respuesta HTTP
      ansible.builtin.uri:
        url: http://127.0.0.1
        status_code: 200
        return_content: true
      register: web_response

    - name: Validar código HTTP
      ansible.builtin.assert:
        that:
          - web_response.status == 200
        fail_msg: >-
          {{ inventory_hostname }} no devuelve HTTP 200
        success_msg: >-
          {{ inventory_hostname }} devuelve HTTP 200

    - name: Validar versión desplegada
      ansible.builtin.assert:
        that:
          - web_version in web_response.content
        fail_msg: >-
          La página de {{ inventory_hostname }}
          no contiene la versión esperada {{ web_version }}
        success_msg: >-
          La página de {{ inventory_hostname }}
          contiene la versión {{ web_version }}

    - name: Validar mensaje desplegado
      ansible.builtin.assert:
        that:
          - web_message in web_response.content
        fail_msg: >-
          La página de {{ inventory_hostname }}
          no contiene el mensaje esperado
        success_msg: >-
          La página de {{ inventory_hostname }}
          contiene el mensaje esperado

    - name: Mostrar resultado final
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          Nginx activo,
          HTTP={{ web_response.status }},
          versión={{ web_version }},
          validación correcta
