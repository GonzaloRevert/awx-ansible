---
- name: Validar despliegue web
  hosts: origenes
  become: true
  gather_facts: true

  tasks:
    - name: Comprobar que Nginx está activo
      ansible.builtin.service_facts:

    - name: Validar servicio Nginx
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service'] is defined
          - ansible_facts.services['nginx.service'].state == 'running'
        fail_msg: "Nginx no está activo en {{ inventory_hostname }}"
        success_msg: "Nginx está activo en {{ inventory_hostname }}"

    - name: Comprobar que existe la página web
      ansible.builtin.stat:
        path: /var/www/html/index.html
      register: web_index

    - name: Validar existencia de la página
      ansible.builtin.assert:
        that:
          - web_index.stat.exists
          - web_index.stat.isreg
        fail_msg: "No existe la página web en {{ inventory_hostname }}"
        success_msg: "La página web existe en {{ inventory_hostname }}"

    - name: Leer página desplegada
      ansible.builtin.slurp:
        src: /var/www/html/index.html
      register: web_page

    - name: Validar versión desplegada
      ansible.builtin.assert:
        that:
          - web_version in (web_page.content | b64decode)
        fail_msg: >-
          La página de {{ inventory_hostname }}
          no contiene la versión esperada {{ web_version }}
        success_msg: >-
          La página de {{ inventory_hostname }}
          contiene la versión {{ web_version }}
