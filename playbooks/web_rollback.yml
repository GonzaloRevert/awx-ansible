---
- name: Rollback del despliegue web
  hosts: Origenes
  become: true
  gather_facts: true
  serial: 1

  vars:
    web_index_file: /var/www/html/index.html
    web_backup_path: /var/backups/awx-web

  tasks:
    - name: Comprobar si existe backup de la página
      ansible.builtin.stat:
        path: "{{ web_backup_path }}/index.html.backup"
      register: web_backup

    - name: Detener rollback si no existe backup
      ansible.builtin.assert:
        that:
          - web_backup.stat.exists
        fail_msg: >-
          No existe backup para realizar rollback en {{ inventory_hostname }}
        success_msg: >-
          Existe backup para realizar rollback en {{ inventory_hostname }}

    - name: Restaurar página anterior
      ansible.builtin.copy:
        src: "{{ web_backup_path }}/index.html.backup"
        dest: "{{ web_index_file }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      register: web_rollback_result

    - name: Validar configuración de Nginx
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Reiniciar Nginx si se restauró la página
      ansible.builtin.service:
        name: nginx
        state: restarted
      when: web_rollback_result.changed

    - name: Comprobar que Nginx está activo
      ansible.builtin.command:
        cmd: service nginx status
      register: nginx_status
      changed_when: false
      failed_when: nginx_status.rc != 0

    - name: Comprobar respuesta HTTP después del rollback
      ansible.builtin.uri:
        url: http://127.0.0.1
        status_code: 200
        return_content: true
      register: web_response

    - name: Mostrar archivo restaurado
      ansible.builtin.debug:
        msg: >-
          Rollback completado en {{ inventory_hostname }}.
          Restaurado: {{ web_backup_path }}/index.html.backup.
          HTTP={{ web_response.status }}
