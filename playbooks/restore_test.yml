---
- name: Prueba de restauración de backup
  hosts: Destino
  become: true
  gather_facts: false

  tasks:
    - name: Buscar backups disponibles
      ansible.builtin.find:
        paths: "{{ backup_destination_path }}"
        patterns: "*.tar.gz"
        recurse: true
      register: backup_files

    - name: Comprobar que existe al menos un backup
      ansible.builtin.assert:
        that:
          - backup_files.matched | int > 0
        fail_msg: "No hay backups disponibles para realizar la prueba"
        success_msg: "Hay backups disponibles para la prueba"

    - name: Seleccionar el backup más reciente
      ansible.builtin.set_fact:
        test_backup: "{{ backup_files.files | sort(attribute='mtime', reverse=true) | first }}"

    - name: Comprobar integridad del backup
      ansible.builtin.command:
        cmd: "tar -tzf {{ test_backup.path }}"
      register: tar_test
      changed_when: false

    - name: Mostrar resultado de la prueba
      ansible.builtin.debug:
        msg: >-
          Backup válido: {{ test_backup.path }}
          | Elementos encontrados: {{ tar_test.stdout_lines | length }}

